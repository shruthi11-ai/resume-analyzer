<!DOCTYPE html>
<html lang="en">
<head>https://github.com/shruthi11-ai/resume-analyzer/pulls
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6fb; color: #1a1a1a; min-height: 100vh; }

    header {
      background: #1e1e2f;
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    header span { font-size: 24px; }

    .main { max-width: 780px; margin: 2rem auto; padding: 0 1rem; }

    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e3e6ef;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .upload-area {
      border: 2px dashed #b0b8d1;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      background: #f8f9ff;
    }
    .upload-area:hover { background: #eef0fb; }
    .upload-area.dragging { border-color: #4f6ef7; background: #eef0fb; }
    .upload-icon { font-size: 36px; margin-bottom: 0.5rem; }
    .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .upload-sub { font-size: 13px; color: #6b7280; }
    #fileInput { display: none; }

    .file-chip {
      display: none;
      align-items: center;
      gap: 8px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      margin-top: 1rem;
      color: #3730a3;
    }
    .file-chip .remove { cursor: pointer; color: #6b7280; font-size: 16px; margin-left: auto; }

    .job-row { display: flex; gap: 10px; margin-top: 1rem; }
    .job-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      color: #1a1a1a;
    }
    .job-row input:focus { outline: none; border-color: #4f6ef7; }

    .analyze-btn {
      padding: 10px 22px;
      background: #1e1e2f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .analyze-btn:hover { background: #2d2d4f; }
    .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error { color: #dc2626; font-size: 13px; margin-top: 8px; }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 500px) { .score-grid { grid-template-columns: repeat(2, 1fr); } }

    .score-card {
      background: #f8f9ff;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      border: 1px solid #e3e6ef;
    }
    .score-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; font-weight: 500; }
    .score-val { font-size: 24px; font-weight: 700; }
    .good { color: #059669; }
    .ok   { color: #d97706; }
    .bad  { color: #dc2626; }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 600;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red   { background: #fee2e2; color: #991b1b; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-blue  { background: #dbeafe; color: #1e40af; }

    .item {
      font-size: 13px;
      color: #374151;
      padding: 7px 0;
      border-bottom: 1px solid #f1f3f7;
      line-height: 1.6;
    }
    .item:last-child { border-bottom: none; }
    .item strong { color: #111827; }

    .verdict-box {
      background: #f0f4ff;
      border-left: 3px solid #4f6ef7;
      border-radius: 0 10px 10px 0;
      padding: 1rem 1.25rem;
    }
    .verdict-box p { font-size: 13px; color: #374151; line-height: 1.7; }

    #results { display: none; }
  </style>
</head>
<body>

<header>
  <span>📄</span>
  <h1>AI Resume Analyzer</h1>
</header>

<div class="main">

  <div class="card">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📂</div>
      <p class="upload-title">Drop your resume here</p>
      <p class="upload-sub">PDF or TXT supported · click to browse</p>
      <input type="file" id="fileInput" accept=".pdf,.txt" />
    </div>

    <div class="file-chip" id="fileChip">
      <span>📄</span>
      <span id="fileName">resume.pdf</span>
      <span class="remove" onclick="clearFile()">✕</span>
    </div>

    <div class="job-row">
      <input type="text" id="jobRole" placeholder="Target role — e.g. AI/ML Engineer, Full Stack Developer" />
      <button class="analyze-btn" id="analyzeBtn" onclick="analyzeResume()" disabled>Analyze ↗</button>
    </div>
    <div id="errorMsg" class="error"></div>
  </div>

  <div id="results">
    <div class="score-grid" id="scoreGrid"></div>
    <div class="card" id="strengthsCard"></div>
    <div class="card" id="weaknessesCard"></div>
    <div class="card" id="missingCard"></div>
    <div class="card" id="fixesCard"></div>
    <div class="card" id="verdictCard"></div>
  </div>

</div>

<script>
  let resumeText = '';

  const uploadArea = document.getElementById('uploadArea');
  const fileInput  = document.getElementById('fileInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const fileChip   = document.getElementById('fileChip');
  const errorMsg   = document.getElementById('errorMsg');

  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragging'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragging'));
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragging'); handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      resumeText = e.target.result;
      fileChip.style.display = 'flex';
      document.getElementById('fileName').textContent = file.name;
      analyzeBtn.disabled = false;
      errorMsg.textContent = '';
    };
    if (file.type === 'application/pdf') {
      reader.readAsDataURL(file);
    } else {
      reader.readAsText(file);
    }
  }

  function clearFile() {
    resumeText = '';
    fileChip.style.display = 'none';
    fileInput.value = '';
    analyzeBtn.disabled = true;
    document.getElementById('results').style.display = 'none';
  }

  function scoreClass(n) { return n >= 75 ? 'good' : n >= 50 ? 'ok' : 'bad'; }

  async function analyzeResume() {
    const jobRole = document.getElementById('jobRole').value || 'Software Developer';
    errorMsg.textContent = '';

    if (!resumeText) { errorMsg.textContent = 'Please upload a resume first.'; return; }

    analyzeBtn.disabled = true;
    const results = document.getElementById('results');
    results.style.display = 'block';

    document.getElementById('scoreGrid').innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Analyzing your resume with AI...</div>`;
    ['strengthsCard','weaknessesCard','missingCard','fixesCard','verdictCard'].forEach(id => document.getElementById(id).innerHTML = '');

    const isBase64PDF = resumeText.startsWith('data:application/pdf');
    let messages;

    if (isBase64PDF) {
      const base64Data = resumeText.split(',')[1];
      messages = [{
        role: 'user',
        content: [
          { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64Data } },
          { type: 'text', text: buildPrompt(jobRole) }
        ]
      }];
    } else {
      messages = [{ role: 'user', content: `Analyze this resume for a "${jobRole}" role:\n\n${resumeText.substring(0,4000)}\n\n${buildPrompt(jobRole)}` }];
    }

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages })
      });

      const data = await response.json();
      const raw = data.content.map(i => i.text || '').join('');
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      renderResults(parsed);
    } catch(err) {
      document.getElementById('scoreGrid').innerHTML = '';
      errorMsg.textContent = 'Analysis failed. Please try again.';
    }

    analyzeBtn.disabled = false;
  }

  function buildPrompt(jobRole) {
    return `Analyze this resume for a "${jobRole}" role. Return ONLY a JSON object, no markdown, no extra text:
{"overallScore":75,"atsScore":60,"impactScore":55,"clarityScore":70,
"strengths":["strength 1","strength 2","strength 3"],
"weaknesses":[{"issue":"issue title","detail":"explanation"}],
"missing":["missing item 1","missing item 2"],
"quickFixes":["fix 1","fix 2","fix 3"],
"verdict":"2-3 sentence honest hiring manager verdict"}`;
  }

  function renderResults(d) {
    document.getElementById('scoreGrid').innerHTML = `
      <div class="score-card"><div class="score-label">Overall</div><div class="score-val ${scoreClass(d.overallScore)}">${d.overallScore}<span style="font-size:14px;font-weight:400">/100</span></div></div>
      <div class="score-card"><div class="score-label">ATS Fit</div><div class="score-val ${scoreClass(d.atsScore)}">${d.atsScore}<span style="font-size:14px;font-weight:400">/100</span></div></div>
      <div class="score-card"><div class="score-label">Impact</div><div class="score-val ${scoreClass(d.impactScore)}">${d.impactScore}<span style="font-size:14px;font-weight:400">/100</span></div></div>
      <div class="score-card"><div class="score-label">Clarity</div><div class="score-val ${scoreClass(d.clarityScore)}">${d.clarityScore}<span style="font-size:14px;font-weight:400">/100</span></div></div>
    `;

    document.getElementById('strengthsCard').innerHTML = `
      <div class="section-title"><span class="badge badge-green">✓ Strengths</span></div>
      ${d.strengths.map(s => `<div class="item">✅ ${s}</div>`).join('')}`;

    document.getElementById('weaknessesCard').innerHTML = `
      <div class="section-title"><span class="badge badge-red">✗ Weaknesses</span></div>
      ${d.weaknesses.map(w => `<div class="item"><strong>${w.issue}</strong> — ${w.detail}</div>`).join('')}`;

    document.getElementById('missingCard').innerHTML = `
      <div class="section-title"><span class="badge badge-amber">⚠ Missing</span></div>
      ${d.missing.map(m => `<div class="item">⚠️ ${m}</div>`).join('')}`;

    document.getElementById('fixesCard').innerHTML = `
      <div class="section-title"><span class="badge badge-blue">⚡ Quick Fixes</span></div>
      ${d.quickFixes.map((f,i) => `<div class="item">${i+1}. ${f}</div>`).join('')}`;

    document.getElementById('verdictCard').innerHTML = `
      <div class="section-title" style="color:#1e40af">🧑‍💼 Hiring Manager Verdict</div>
      <div class="verdict-box"><p>${d.verdict}</p></div>`;
  }
</script>

</body>
</html>
